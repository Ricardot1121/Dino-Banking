<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>
    <h1>Welcome, Admin {{ user.first_name }}</h1>
    <h2>All Users</h2>
    <ul>
        {% for u in users %}
            <li>{{ u.first_name }} {{ u.last_name }} - {{ u.username }}</li>
        {% endfor %}
    </ul>
</body>
</html>
